<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Drop shadow for sticky notes -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    
    <!-- Drop shadow for push pins -->
    <filter id="pin-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Corkboard background pattern -->
    <pattern id="cork" patternUnits="userSpaceOnUse" width="100" height="100">
      <rect width="100" height="100" fill="#b07d57"/>
      <!-- Noise/Texture approximation -->
      <circle cx="20" cy="20" r="2.5" fill="#875330" opacity="0.6"/>
      <circle cx="80" cy="40" r="3" fill="#875330" opacity="0.5"/>
      <circle cx="45" cy="80" r="3.5" fill="#875330" opacity="0.4"/>
      <circle cx="10" cy="70" r="3" fill="#c69571" opacity="0.7"/>
      <circle cx="90" cy="85" r="2" fill="#c69571" opacity="0.6"/>
      <circle cx="65" cy="15" r="2" fill="#875330" opacity="0.5"/>
      <circle cx="35" cy="55" r="3" fill="#c69571" opacity="0.5"/>
      <circle cx="75" cy="65" r="2" fill="#522a13" opacity="0.4"/>
      <circle cx="50" cy="30" r="4" fill="#c69571" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#cork)" />

  <!-- Note 1 (Retrieval) -->
  <rect x="65" y="60" width="200" height="310" fill="#d0f0f5" filter="url(#shadow)"/>
  <text x="165" y="255" font-family="Arial, Helvetica, sans-serif" font-size="140" font-weight="bold" fill="#1874bc" text-anchor="middle">R</text>
  <text x="165" y="320" font-family="'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="bold" fill="#3a3a3a" text-anchor="middle" letter-spacing="0.5">RETRIEVAL</text>

  <!-- Note 2 (Augmented) -->
  <rect x="300" y="60" width="200" height="310" fill="#ffcce3" filter="url(#shadow)"/>
  <text x="400" y="255" font-family="Arial, Helvetica, sans-serif" font-size="140" font-weight="bold" fill="#da1010" text-anchor="middle">A</text>
  <text x="400" y="320" font-family="'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="bold" fill="#3a3a3a" text-anchor="middle" letter-spacing="0.5">AUGMENTED</text>

  <!-- Note 3 (Generation) -->
  <rect x="535" y="60" width="200" height="310" fill="#fdf0be" filter="url(#shadow)"/>
  <text x="635" y="255" font-family="Arial, Helvetica, sans-serif" font-size="140" font-weight="bold" fill="#c49b06" text-anchor="middle">G</text>
  <text x="635" y="320" font-family="'Arial Narrow', Arial, sans-serif" font-size="24" font-weight="bold" fill="#3a3a3a" text-anchor="middle" letter-spacing="0.5">GENERATION</text>

  <!-- Push Pins -->
  <!-- Pin 1 -->
  <circle cx="155" cy="75" r="11" fill="#0066cc" filter="url(#pin-shadow)"/>
  <circle cx="151" cy="71" r="3.5" fill="#ffffff" opacity="0.6"/>
  
  <!-- Pin 2 -->
  <circle cx="400" cy="72" r="11" fill="#cc0000" filter="url(#pin-shadow)"/>
  <circle cx="396" cy="68" r="3.5" fill="#ffffff" opacity="0.6"/>
  
  <!-- Pin 3 -->
  <circle cx="645" cy="75" r="11" fill="#ffcc00" filter="url(#pin-shadow)"/>
  <circle cx="641" cy="71" r="3.5" fill="#ffffff" opacity="0.6"/>
</svg>
